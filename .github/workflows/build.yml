name: build-deb

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Install theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C $THEOS/sdks --strip-components=1
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Collect
        run: |
          mkdir -p out
          cp packages/*.deb out/
          cd out && zip -r fivea-deb.zip *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: fivea-deb
          path: out/fivea-deb.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "FiveA ${GITHUB_REF_NAME}" \
              --notes "把状态栏的 5G+ 显示成 5Gᴀ，仅在系统真实上报载波聚合时生效。"
          fi
          gh release upload "${GITHUB_REF_NAME}" out/*.deb --clobber
